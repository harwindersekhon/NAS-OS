name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: .venv/bin/ruff check nasos tests
      - name: Mypy
        working-directory: backend
        run: .venv/bin/mypy nasos tests
      - name: Pytest
        working-directory: backend
        run: .venv/bin/pytest

  frontend:
    name: Frontend (vitest, eslint, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Playwright smoke (login -> desktop -> dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  rpm-lint:
    name: RPM spec lint (rocky-10)
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Install rpmlint
        run: dnf install -y rpmlint
      - name: rpmlint
        run: rpmlint packaging/rpm/nasos.spec

  # Real RPM builds (mock -r rocky-10-x86_64) and the privileged
  # systemd-in-container system-test suite land once there's meaningful
  # service behaviour to package and exercise (Milestone 2 onward) — see
  # PLAN.md §11 and §12 (Milestone 8 gate: "CI green incl. container system
  # tests").
