[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasos"
version = "0.1.0"
description = "DSM-style NAS management system"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.36",
    "alembic==1.20.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "psutil==7.2.2",
    "aiofiles==25.1.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil",
]

[project.scripts]
nasos-web = "nasos.cli.web:main"
nasos-agent = "nasos.cli.agent:main"
nasos-fileworker = "nasos.agent.fileworker:main"
nasos-task-run = "nasos.cli.taskrun:main"
nasos-setup = "nasos.cli.setup:main"
nasos-cli = "nasos.cli.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["nasos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-default is the documented DI pattern, not
# the mutable-default-argument footgun this rule exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
